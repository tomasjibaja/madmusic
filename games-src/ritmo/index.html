<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  @property --bg1{syntax:'<color>';inherits:true;initial-value:#0a1f44}
  @property --bg2{syntax:'<color>';inherits:true;initial-value:#0f4c8a}
  @property --bg3{syntax:'<color>';inherits:true;initial-value:#0e7a99}
  :root{--navy:#0a1f44;--sea:#0f4c8a;--teal:#0e7a99;--sun:#ffd23f;--orange:#ff7a3d;--mint:#3be8b0;--coral:#ff5c7a;--ink:#0a1f44}
  html,body{margin:0}
  body{font-family:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;font-weight:500;color:#fff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 16px;background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);background-attachment:fixed;overflow-x:hidden;transition:--bg1 1.4s,--bg2 1.4s,--bg3 1.4s}
  body.lv0{--bg1:#0a1f44;--bg2:#0f4c8a;--bg3:#0e7a99;--panel:rgba(6,20,48,.5)}
  body.lv1{--bg1:#150f4d;--bg2:#43299e;--bg3:#7d3aa6;--panel:rgba(18,8,52,.52)}
  body.lv2{--bg1:#3a0f4a;--bg2:#9a2060;--bg3:#d4404a;--panel:rgba(44,8,40,.52)}
  body.lv3{--bg1:#3d0508;--bg2:#a3121c;--bg3:#ff5a2a;--panel:rgba(48,5,8,.55)}
  [hidden]{display:none!important}
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:url('assets/pattern.png') 0 0/420px 420px;animation:drift 70s linear infinite}
  #waves{position:fixed;left:0;right:0;bottom:0;width:100%;height:90px;z-index:0;pointer-events:none}
  #play,.screen,#top{position:relative;z-index:1}
  #play{display:flex;flex-direction:column;align-items:center;width:100%;flex:1}
  #top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:720px;padding:4px 6px}
  #lvl{display:inline-block;font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--ink);background:var(--sun);padding:4px 14px;border-radius:999px;box-shadow:0 3px 0 #c99a0a}
  #dots{display:flex;gap:5px;margin-top:9px}
  #dots i{width:22px;height:9px;border-radius:99px;background:rgba(255,255,255,.22)}
  #dots i.done{background:var(--mint);box-shadow:0 0 8px rgba(59,232,176,.7)}
  #dots i.cur{background:var(--sun);box-shadow:0 0 10px rgba(255,210,63,.9);animation:glow 1.2s ease-in-out infinite}
  #score{font-weight:700;font-size:22px;color:var(--sun);background:rgba(7,22,52,.6);border:2px solid var(--sun);border-radius:999px;padding:5px 16px;box-shadow:0 0 14px rgba(255,210,63,.35);text-shadow:0 2px 0 rgba(0,0,0,.35)}
  #upper{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;width:100%;position:relative;z-index:1}
  #pattern{--gap:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);width:100%;padding:9px;background:var(--panel,rgba(6,20,48,.5));border:2px solid rgba(255,255,255,.14);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #pattern.p4{max-width:720px}
  #pattern.p8{max-width:min(100%,560px,calc((30dvh - 28px) / .5));--gap:8px;padding:10px}
  #pattern.p12{max-width:min(100%,560px,calc((36dvh - 30px) / .75));--gap:7px;padding:9px}
  .card{position:relative;flex:0 0 calc((100% - 3 * var(--gap)) / 4);align-self:flex-start;aspect-ratio:1;background:#fff;border-radius:18px;border-bottom:6px solid #c9d4e6;box-shadow:0 5px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:4%;transition:background .25s,border-color .25s,box-shadow .25s}
  .card img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .card.won{background:#d6fbe6;border-bottom-color:#18b872;box-shadow:0 0 22px rgba(59,232,176,.9),0 5px 12px rgba(0,0,0,.3)}
  .card.lose{background:#e6a9a6;border-bottom-color:#a93039;box-shadow:0 0 12px rgba(255,92,122,.4),0 5px 12px rgba(0,0,0,.3)}
  .card.lose img{opacity:.55}
  .card.lose.flag{background:#ffc9d1;border-bottom-color:#e0405c;box-shadow:0 0 0 3px #ff4d5e,0 0 22px rgba(255,60,90,.95),0 5px 12px rgba(0,0,0,.3)}
  .card.lose.flag img{opacity:1}
  .card .alert{position:absolute;top:-10px;right:-9px;width:27px;height:27px;z-index:2;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
  #msg{min-height:2.4em;font-size:27px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  #msg.hint{font-size:18px;font-weight:500;color:#bcd8ff}
  #msg.ok{color:#5dffb8;text-shadow:0 0 18px rgba(93,255,184,.7),0 3px 0 rgba(0,0,0,.3)}
  #msg.bad{color:#ff9bb0;font-size:19px;font-weight:600}
  #lower{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;position:relative;z-index:1}
  #listen{font:inherit;font-size:16px;font-weight:600;color:#fff;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 18px;cursor:pointer}
  #listen:disabled{opacity:.4;cursor:default}
  #tap{width:min(64vw,38dvh,290px);aspect-ratio:1;border-radius:50%;border:0;color:#fff;font:inherit;font-size:34px;font-weight:700;letter-spacing:.12em;text-shadow:0 3px 0 rgba(120,30,0,.55);background:radial-gradient(circle at 34% 26%,#ffc05a 0%,#ff7a3d 55%,#ef4f1f 100%);box-shadow:0 10px 0 #a8310f,0 0 0 9px rgba(255,255,255,.14),0 22px 34px rgba(0,0,0,.45),inset 0 8px 12px rgba(255,255,255,.35),inset 0 -8px 14px rgba(120,30,0,.25);touch-action:none;user-select:none;-webkit-user-select:none;outline:none;transition:opacity .25s}
  #tap.off{opacity:.3}
  footer{position:relative;z-index:1;margin-top:auto;padding-top:10px;font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.62);text-shadow:0 1px 0 rgba(0,0,0,.4);text-align:center}
  .screen{--panel:rgba(6,20,48,.62);text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:9vh;padding:26px 22px 28px;width:100%;max-width:380px;background:var(--panel);border:2px solid rgba(255,255,255,.18);border-radius:32px;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 40px rgba(255,210,63,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .screen h1{margin:0;font-size:36px;line-height:1.05;color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.35);animation:zoom .7s cubic-bezier(.2,1.6,.4,1) both}
  .screen .pts{font-size:19px;color:#bcd8ff}
  .screen .pts b{font-size:60px;line-height:1.1;color:var(--sun);display:block;text-shadow:0 0 22px rgba(255,210,63,.6),0 4px 0 rgba(0,0,0,.35)}
  #stars{display:flex;gap:6px;font-size:44px;line-height:1}
  #stars span{display:inline-block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  #nextHint{font-size:17px;color:#ffe9a8;min-height:1.2em}
  .emoji{font-size:88px;line-height:1;animation:bounce 1s ease infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
  .big{font:inherit;font-size:21px;font-weight:700;padding:15px 30px;border:0;border-radius:18px;color:#fff;text-shadow:0 2px 0 rgba(120,30,0,.5);background:linear-gradient(#ff9a4a,#ff6a2b);box-shadow:0 7px 0 #a8310f,0 12px 18px rgba(0,0,0,.35)}
  #fx,#flash{position:fixed;inset:0;pointer-events:none;z-index:10}
  #flash{opacity:0}
  @keyframes drift{to{background-position:420px 420px}}
  @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes zoom{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  #lower{max-width:720px}
  /* --- tarjetas --- */
  #cards{position:absolute;left:2px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:20px;z-index:2}
  .ccard{position:relative;display:block;width:50px;height:70px;padding:0;border:3px solid;border-radius:11px;cursor:pointer;font:inherit;color:#fff;transition:scale .15s,opacity .2s,filter .2s,box-shadow .2s;animation:floaty 2.6s ease-in-out infinite}
  .ccard::after{content:'';position:absolute;inset:3px;border-radius:7px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%);pointer-events:none}
  .ccard.y{background:linear-gradient(150deg,#fff27a,#ffd400 55%,#e8b400);border-color:#a37d00;rotate:-7deg;box-shadow:0 5px 0 #7a5d00,0 8px 14px rgba(0,0,0,.4)}
  .ccard.r{background:linear-gradient(150deg,#ff8a80,#e53935 55%,#b71c1c);border-color:#7f0f0f;rotate:6deg;box-shadow:0 5px 0 #5c0a0a,0 8px 14px rgba(0,0,0,.4);animation-delay:-1.3s}
  .ccard .ico{position:absolute;left:50%;top:50%;width:34px;height:34px;translate:-50% -50%;overflow:visible;pointer-events:none}
  .ccard.r .ico{filter:drop-shadow(0 2px 0 rgba(90,0,0,.55))}
  .ccard.y .ico{filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
  .cnt{position:absolute;top:-11px;right:-11px;z-index:1;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:#fff;color:#0a1f44;border:2px solid #0a1f44;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .ccard.sel{scale:1.2;box-shadow:0 0 0 4px #fff,0 0 24px 8px rgba(255,255,255,.75);animation:none}
  .ccard.off{opacity:.4;filter:grayscale(.45);animation:none}
  .ccard.fly{position:fixed;z-index:12;margin:0;pointer-events:none;animation:none}
  .card.pick-y,.card.pick-r{cursor:pointer;animation:pickpulse .85s ease-in-out infinite}
  .card.pick-y{border-bottom-color:#e8b400;box-shadow:0 0 0 3px #ffd400,0 0 22px rgba(255,212,0,.95)}
  .card.pick-r{border-bottom-color:#e53935;box-shadow:0 0 0 3px #ff4d4d,0 0 22px rgba(255,60,60,.95)}
  .card.dim{opacity:.32;filter:grayscale(.6)}
  /* --- jackpot (elegante) --- */
  .jp{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(4,6,18,.74);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .jp-panel{--rs:min(92px,21vw);position:relative;width:min(94vw,400px);padding:26px 12px 24px;border-radius:26px;text-align:center;
    background:repeating-linear-gradient(45deg,rgba(232,195,106,.07) 0 1px,transparent 1px 15px),repeating-linear-gradient(-45deg,rgba(232,195,106,.07) 0 1px,transparent 1px 15px),linear-gradient(165deg,#1a1f3d 0%,#0d1025 100%);
    border:1px solid rgba(232,195,106,.6);box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04) inset,0 0 70px rgba(232,190,90,.16)}
  .orn{position:absolute;width:22px;height:22px;border:2px solid #e2b857;pointer-events:none}
  .orn.tl{top:9px;left:9px;border-right:0;border-bottom:0;border-top-left-radius:9px}
  .orn.tr{top:9px;right:9px;border-left:0;border-bottom:0;border-top-right-radius:9px}
  .orn.bl{bottom:9px;left:9px;border-right:0;border-top:0;border-bottom-left-radius:9px}
  .orn.br{bottom:9px;right:9px;border-left:0;border-top:0;border-bottom-right-radius:9px}
  .jp-head{display:flex;align-items:center;gap:10px;padding:0 22px}
  .jp-head .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#e2b857)}
  .jp-head .ln.r{background:linear-gradient(270deg,transparent,#e2b857)}
  .jp-head .dia{width:7px;height:7px;background:#e2b857;transform:rotate(45deg);flex:0 0 7px}
  .jp-title{font-size:21px;font-weight:600;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;background:linear-gradient(#fff4d2,#dcae4f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .jp-sub{min-height:1.5em;margin:12px 0 18px;font-size:14px;letter-spacing:.05em;color:#b3b2d2}
  .jp-machine{display:flex;align-items:stretch;justify-content:center;gap:9px}
  .jp-reels{display:flex;gap:8px;padding:10px;background:#090b1b;border-radius:16px;border:1px solid rgba(232,195,106,.4);box-shadow:inset 0 2px 14px rgba(0,0,0,.85),0 0 24px rgba(232,195,106,.1)}
  .reel{width:var(--rs);height:var(--rs);overflow:hidden;border-radius:12px;background:#f6f3ec;position:relative;box-shadow:inset 0 9px 10px -5px rgba(0,0,0,.4),inset 0 -9px 10px -5px rgba(0,0,0,.4)}
  .strip{display:flex;flex-direction:column;will-change:transform;transition:filter .25s}
  .cell{flex:0 0 var(--rs);height:var(--rs);padding:10%;display:flex;align-items:center;justify-content:center}
  .cell img{width:100%;height:100%;object-fit:contain}
  .reel.win{animation:reelwin .5s ease-in-out 4}
  .jp-lever{position:relative;flex:0 0 34px;width:34px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
  .jp-lever .rail{position:absolute;left:50%;top:4px;bottom:4px;width:10px;margin-left:-5px;border-radius:5px;background:linear-gradient(90deg,#070918,#2b3158 50%,#070918);border:1px solid rgba(232,195,106,.4)}
  .jp-lever .knob{position:absolute;left:50%;top:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a0,#dcab42 58%,#8c6414);box-shadow:0 3px 0 #5a3f0e,0 7px 12px rgba(0,0,0,.55)}
  .jp-lever.ready .knob{animation:leverhint 1.4s ease-in-out infinite}
  .jp-lever.used{cursor:default;pointer-events:none}
  .jp-rule{position:relative;height:1px;margin:20px 16px 18px;background:linear-gradient(90deg,transparent,rgba(232,195,106,.65),transparent)}
  .jp-rule i{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;background:#e2b857;transform:rotate(45deg)}
  .jp-slot{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .jp-stop{font:inherit;font-size:16px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;padding:15px 0 15px .34em;width:82%;border-radius:999px;border:1px solid #f0cd7c;color:#1d1503;background:linear-gradient(#f8e1a2,#d8a53a);box-shadow:0 5px 0 #8c6414,0 12px 20px rgba(0,0,0,.45);touch-action:none;outline:none;-webkit-user-select:none;user-select:none;opacity:.32;pointer-events:none;transition:opacity .25s}
  .jp-stop.on{opacity:1;pointer-events:auto}
  .jp-stop.gone{display:none}
  .jp-result{font-size:23px;font-weight:600;letter-spacing:.06em;line-height:1.15;color:#f3e6c4;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:5px}
  .jp-result small{font-size:14px;font-weight:500;letter-spacing:.08em;color:#d3c59e}
  .jp-result.none{font-size:18px;font-weight:500;color:#b3b2d2}
  .jp-result.gd{color:#f6d889}.jp-result.yw{color:#ffe27a}.jp-result.rd{color:#ff9d9d}
  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -5px}}
  @keyframes pickpulse{0%,100%{scale:1}50%{scale:1.09}}
  @keyframes reelwin{0%,100%{box-shadow:inset 0 9px 10px -5px rgba(0,0,0,.4),inset 0 -9px 10px -5px rgba(0,0,0,.4)}50%{box-shadow:inset 0 0 18px rgba(232,195,106,.9),0 0 22px 6px rgba(232,195,106,.9)}}
  @keyframes leverhint{0%,100%{translate:0 0;filter:brightness(1)}50%{translate:0 10px;filter:brightness(1.25)}}
</style></head><body class="lv0">
<div id="bg"></div>
<svg id="waves" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 40 Q50 18 100 40 T200 40 T300 40 T400 40 V90 H0Z" fill="rgba(255,255,255,.07)"/>
  <path d="M0 58 Q50 38 100 58 T200 58 T300 58 T400 58 V90 H0Z" fill="rgba(255,255,255,.07)"/>
  <path d="M0 74 Q50 58 100 74 T200 74 T300 74 T400 74 V90 H0Z" fill="rgba(6,20,48,.35)"/>
</svg>
<canvas id="fx"></canvas><div id="flash"></div>
<div id="play">
  <div id="top">
    <div><div id="lvl"></div><div id="dots"></div></div>
    <div id="score">⭐ 0</div>
  </div>
  <div id="upper">
    <div id="pattern"></div>
    <div id="msg"></div>
  </div>
  <div id="lower">
    <button id="listen" type="button">🔊 Escuchar una vez</button>
    <div id="cards">
      <button class="ccard y" id="cardY" hidden title="Tarjeta amarilla: convierte un barco o marinero en sol"><span class="cnt">0</span></button>
      <button class="ccard r" id="cardR" hidden title="Tarjeta roja: elimina un pulso"><span class="cnt">0</span></button>
    </div>
    <button id="tap">TAP</button>
  </div>
</div>
<div id="levelDone" class="screen" hidden>
  <div class="emoji" id="lvlEmoji">🎉</div>
  <div id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <h1 id="levelDoneTitle"></h1>
  <div class="pts">Puntaje del nivel<b id="levelPts"></b></div>
  <div id="nextHint"></div>
  <button id="nextLevel" class="big">Pasar al siguiente nivel</button>
</div>
<div id="finished" class="screen" hidden>
  <div class="emoji">🏆</div>
  <h1>¡Completaste todos los niveles!</h1>
  <div class="pts">Puntaje final<b id="finalPts"></b></div>
  <p style="margin:0;opacity:.85">Incluye +50 de bonus por terminar 🏆</p>
  <button id="restart" class="big">Volver a empezar</button>
</div>
<div id="jackpot" class="jp" hidden>
  <div class="jp-panel">
    <span class="orn tl"></span><span class="orn tr"></span><span class="orn bl"></span><span class="orn br"></span>
    <div class="jp-head"><i class="ln"></i><i class="dia"></i><div class="jp-title">Jackpot</div><i class="dia"></i><i class="ln r"></i></div>
    <div class="jp-sub" id="jpSub"></div>
    <div class="jp-machine">
      <div class="jp-reels">
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
      </div>
      <div class="jp-lever" id="jpLever"><div class="rail"></div><div class="knob"></div></div>
    </div>
    <div class="jp-rule"><i></i></div>
    <div class="jp-slot">
      <button class="jp-stop" id="jpStop">Detener</button>
      <div class="jp-result" id="jpResult"></div>
    </div>
  </div>
</div>
<footer>Tomás Jibaja - Profesor de Música</footer>
<script type="module" src="src/ui.js"></script>
</body></html>
