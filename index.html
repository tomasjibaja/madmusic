<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="${nw?'new-password':'current-password'}" required>
<p class="err" id="er"></p><button class="btn">${nw?'Siguiente: elegir personaje':'Entrar'}</button>
${nw?`<p style="margin:8px 0 0"><button type="button" class="btn sm gh" onclick="mode='login';render()">Ya tengo usuario</button></p>`:ST.allowSignup?`<p class="or">¿Primera vez acá?</p><button type="button" class="btn" onclick="mode='new';render()">Crear mi usuario</button>`:'<p class="or">Por ahora no se pueden crear usuarios nuevos.</p>'}${nw?'':`<p style="margin:6px 0 0"><button type="button" class="lnk" onclick="mode='reset';render()">Tengo un código de blanqueo</button></p>`}</form></div>`}
function pickScreen(){const bg=i=>`radial-gradient(circle at 50% 72%,rgba(255,255,255,.55),transparent 62%),${AV[i].bg}`;
return `<div class="card" style="padding:14px;margin-bottom:12px"><h1 class="dp" style="font-size:1.7rem">Elegí tu personaje</h1><p style="margin:4px 0 0">Paso 2 de 2. Pasá con las flechas o deslizando. Va a crecer y mejorar con tus puntos.</p></div>
<div class="cz"><button class="arw l" aria-label="Anterior" onclick="cgo(-1)">‹</button><button class="arw r" aria-label="Siguiente" onclick="cgo(1)">›</button>
<div class="cvp" ontouchstart="tx0=event.touches[0].clientX" ontouchend="if(tx0!=null){const d=event.changedTouches[0].clientX-tx0;if(Math.abs(d)>50)cgo(d<0?1:-1);tx0=null}"><div class="ctr" id="ctr" style="--c:${cs}">${CH.map((c,i)=>`<section class="cs ${i===cs?'live':''}" aria-hidden="${i!==cs}" aria-label="${c.n}"><div class="stage" style="background:${bg(i)}">${fig(i,pvMax?10:1)}</div></section>`).join('')}</div></div></div>
${animBar()}<div class="dots2" id="dots2">${CH.map((_,i)=>`<i class="${i===cs?'cur':''}"></i>`).join('')}</div>
<div class="pbar"><button class="btn sm gh" onclick="mode='new';render()">‹ Atrás</button><button class="btn sm gh" onclick="pvMax=!pvMax;render()">${pvMax?'Ver nivel 1':'✨ Ver nivel 10'}</button><button class="btn pk" id="cbtn" onclick="createAcc()">Elegir este personaje</button></div>`}
function cgo(d){cs=(cs+d+CH.length)%CH.length;$('#ctr').style.setProperty('--c',cs);document.querySelectorAll('.cs').forEach((e,k)=>{e.classList.toggle('live',k===cs);e.setAttribute('aria-hidden',k!==cs)});document.querySelectorAll('#dots2 i').forEach((e,k)=>e.className=k===cs?'cur':'')}
addEventListener('keydown',e=>{if(mode==='pick'&&draft&&$('#ctr')){if(e.key==='ArrowRight')cgo(1);if(e.key==='ArrowLeft')cgo(-1)}});
async function createAcc(){chosen=cs;if(!draft)return;const bt=$('#cbtn');if(bt)bt.disabled=true;
try{setSession(await api('register','POST',{username:draft.n,password:draft.p,avatar:chosen}));draft=null;chosen=-1;mode='login';tab='games';render();window.scrollTo(0,0);toast('¡Bienvenido!')}
catch(e){if(e.status&&e.status<500){mode='new';render();const er=$('#er');if(er)er.textContent=e.error}else{toast(e.error);if(bt)bt.disabled=false}}}
async function go(ev){ev.preventDefault();const n=$('#un').value.trim(),p=$('#pw').value,er=$('#er');
if(mode==='new'){if(!ST.allowSignup)return er.textContent='Por ahora no se pueden crear usuarios nuevos.';if(n.length<3||n.length>16)return er.textContent='El usuario necesita entre 3 y 16 caracteres.';if(!/^[\p{L}\p{N}_.\- ]+$/u.test(n))return er.textContent='Usá solo letras, números, guiones y puntos.';if(p.length<4)return er.textContent='La contraseña necesita 4 caracteres o más.';
draft={n,p};cs=0;pvMax=false;mode='pick';render();window.scrollTo(0,0);return}
try{er.textContent='';setSession(await api('login','POST',{username:n,password:p}));tab='games';render()}catch(e){er.textContent=e.error}}
function main(u){const body=tab==='games'?games(u):tab==='theory'?theory(u):tab==='rank'?rank(u):profile(u);
return `<div class="hdr">${ava(u.avatar,total(u))}<div class="nm dp">${esc(u.name)}</div><div class="pts">${total(u)} pts</div></div>${body}
<nav class="tabs" aria-label="Secciones">${[['games','🎮 Juegos'],['theory','📖 Teoría'],['rank','🏆 Ranking'],['profile','⭐ Perfil']].map(([k,l])=>`<button ${tab===k?'aria-current="page"':''} onclick="nav('${k}')">${l}</button>`).join('')}</nav>`}
function games(u){return `<div class="cards">${GAMES.filter(g=>g.ready||(ST.games&&ST.games[g.id]===true)).map(g=>{const op=ST.games&&ST.games[g.id]===true,lk=g.ready&&!op;return `<div class="card tc ${lk?'lock':''}"><div class="top" style="background:${g.c}">${lk?'🔒':g.e}</div><div class="bd"><h3>${g.n}</h3>${lk?'<small>Se habilita cuando lo veamos en clase</small>':`<small>${g.a} · ${u.points[g.id]||0} pts</small>`}${g.ready?(op?`<small>${(u.stats&&u.stats[g.id])?`${g.battle?'Mejor batalla':'Mejor'}: ${u.stats[g.id].best} · ${g.battle?'Ganadas':'Partidas'}: ${u.stats[g.id].plays}`:'Todavía no jugaste'}</small><button class="btn sm pk" onclick="playG('${g.id}')">${u.prog&&u.prog[g.id]?'Continuar':'Jugar'}</button>`:''):'<span class="tag">Próximamente</span>'}</div></div>`}).join('')}</div>`}
function theory(u){return `<div class="cards">${TH.map(t=>{const r=u.read[t.id]||{v:[]},n=r.v.length,op=ST.topics[t.id]===true;return `<div class="card tc ${op?'':'lock'}"><div class="top" style="background:${t.c}">${op?t.e:'🔒'}</div><div class="bd"><h3>${t.n}</h3>${op?`<div class="bar"><i style="width:${n/t.total*100}%;background:var(--mint)"></i></div><small>${r.done?'✅ Leída completa':n?`Vas ${n} de ${t.total}`:'Sin empezar'}</small><button class="btn sm" onclick="openT('${t.id}')">${n?'Seguir':'Leer'}</button>`:`<small>Se habilita cuando lo veamos en clase</small>`}</div></div>`}).join('')}</div>`}
function prev(i,v){v=+v;$('#hero').innerHTML=fig(i,v);$('#pvl').textContent=v===lvInfo(total(me())).lv?'Nivel actual':'Vista previa: nivel '+v;$('#up').innerHTML=upList(v)}
const upList=lv=>`<ul class="ul">${UPG.map((n,k)=>`<li class="${lv>=k+2?'':'lk'}">${lv>=k+2?'✅':'🔒'} Nivel ${k+2}: ${n}</li>`).join('')}</ul>`;
function profile(u){const T=total(u),L=lvInfo(T),c=CH[u.avatar],best=Math.max(1,...AREAS.map(a=>area(u,a)));
const st=Object.values(u.stats||{}),plays=st.reduce((a,x)=>a+x.plays,0),bestRun=Math.max(0,...st.map(x=>x.best)),reads=Object.values(u.read||{}).filter(r=>r.done).length;
return `<div class="card hero live" style="background:${AV[u.avatar].bg}"><div id="hero">${fig(u.avatar,L.lv)}</div></div>
${animBar()}<div class="card" style="padding:16px;margin-bottom:16px"><span class="lvt" style="font-size:1.1rem">Nivel ${L.lv}</span><div style="height:10px"></div><div class="bar"><i style="width:${L.pct*100}%;background:var(--pink)"></i></div><small>${L.next?`Te faltan ${L.next-T} puntos para el nivel ${L.lv+1}`:'¡Nivel máximo alcanzado!'}</small></div>
<div class="stg"><div class="card st"><b class="dp">${T}</b><span>Puntos totales</span></div><div class="card st"><b class="dp">${plays}</b><span>Partidas terminadas</span></div><div class="card st"><b class="dp">${bestRun}</b><span>Mejor partida</span></div><div class="card st"><b class="dp">${reads}</b><span>Temas leídos</span></div></div>
<div class="card" style="padding:16px;margin-bottom:16px"><h3>Puntos por área</h3>${AREAS.map((a,i)=>`<div class="row"><span>${a}</span><div class="bar"><i style="width:${area(u,a)/best*100}%;background:${['var(--sky)','var(--pink)','var(--sun)','var(--mint)'][i]}"></i></div><b>${area(u,a)}</b></div>`).join('')}</div>
<div class="card" style="padding:16px;margin-bottom:16px"><h3>Mejoras</h3><p style="margin:4px 0"><small>Deslizá para ver cómo va a lucir en cada nivel. <b id="pvl">Nivel actual</b></small></p><input type="range" min="1" max="${LV_MAX}" value="${L.lv}" aria-label="Vista previa de nivel" oninput="prev(${u.avatar},this.value)"><div id="up">${upList(L.lv)}</div></div>
<button class="btn gh" onclick="logout()">Salir</button>`}
const area=(u,a)=>GAMES.filter(g=>g.a===a).reduce((s,g)=>s+(u.points[g.id]||0),0);

function rank(u){if(!RK)return '<p style="text-align:center">Cargando ranking…</p>';if(RK.error)return `<p class="err">${esc(RK.error)}</p>`;
return `<div class="card" style="padding:14px;margin-bottom:16px"><h3>Estás en el puesto ${RK.me} de ${RK.total}</h3><small>Los puntos de todos los juegos se suman.</small></div>${RK.list.map(x=>`<div class="card rk ${x.me?'me':''}"><div class="n">${['🥇','🥈','🥉'][x.pos-1]||x.pos}</div>${ava(x.a,x.p)}<div class="nm dp">${esc(x.n)}</div><div class="pts" style="background:#fff">${x.p} pts</div></div>`).join('')}`}

/* ---------- Audio y ondas ---------- */
let ac;function tone(f,type='sine',g=.12,d=.8){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(ac.destination);o.start();o.stop(t+d+.05)}catch(e){}}
function W(c,a,col,type='sine'){let p='';for(let x=0;x<=300;x+=2){const q=x/300*c,f=q%1;const y=type==='sine'?Math.sin(2*Math.PI*q):type==='square'?(f<.5?1:-1):type==='sawtooth'?2*f-1:4*Math.abs(f-.5)*-1*-1*2-1+0;const yy=type==='triangle'?(4*Math.abs(f-.5)-1):y;p+=(x?'L':'M')+x+' '+(35-yy*a*28).toFixed(1)}
return `<svg class="wv" viewBox="0 0 300 70" aria-hidden="true"><path d="${p}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/></svg>`}
const B=(l,js,c='')=>`<button class="btn sm ${c}" onclick="${js}">▶ ${l}</button>`;

const blank=n=>'<div class="pd"></div>'.repeat(n);
const sq=l=>l.forEach(([t,f,ty,g,d])=>setTimeout(()=>tone(f,ty||'sine',g??.15,d||.15),t));
const fl=(b,k)=>{const x=b.closest('.sc').querySelectorAll('.pd');x.forEach((e,j)=>e.classList.toggle('on',k>=0&&j===k%x.length))};
function pulse(b,n,bpm,acc){const ms=60000/bpm;for(let i=0;i<n;i++)setTimeout(()=>{tone(acc&&i%acc===0?1300:850,'square',.07,.07);fl(b,i)},i*ms);setTimeout(()=>fl(b,-1),n*ms)}
function pat(b,a,bpm){const ms=60000/bpm;a.forEach((s,i)=>{setTimeout(()=>fl(b,i),i*ms);for(let k=0;k<s;k++)setTimeout(()=>tone(700,'triangle',.18,.1),i*ms+k*ms/s)});setTimeout(()=>fl(b,-1),a.length*ms)}
let ED=[0,0,1,0];function ed(el,i){ED[i]=(ED[i]+1)%3;el.innerHTML=`<img src="${IMG[K[ED[i]]]}" alt="">`}
const stones=()=>sq([0,300,450,900,1050,1200].map(t=>[t,1300,'triangle',.14,.05])),drum=()=>sq([0,500,750,1000,1500].map(t=>[t,85,'sine',.45,.3])),flute=()=>sq([[0,523,'sine',.14,.7],[750,659,'sine',.14,.7],[1500,587,'sine',.14,1]]);
const NT=[392,392,392,392,392,392];
const fin=(ch,g,gn)=>`<h2 class="dp">¡Llegaste al final!</h2><div class="chips">${ch.map(c=>`<div>${c}</div>`).join('')}</div>${g?`<p><button class="btn pk" onclick="closeT();playG('${g}')">🎮 Jugar ${gn}</button></p>`:''}<p id="fin"></p>`;
const lb=t=>`<div class="lbl">${t}</div>`;
const sym=(s,t,j)=>`<div class="pl" style="align-items:center"><span class="sym">${s}</span><span style="flex:1">${t}</span>${B('Escuchar',j)}</div>`;
const TOP={
t1:{n:'¿Qué es la música?',e:'🎶',c:'#6B4DE6',s:[
['#6B4DE6','#FF5C8A',H('La música','<p>Es el <b>arte de combinar sonidos y silencio</b>. Es una forma de expresarnos: permite comunicar mensajes y conmover a través de las emociones que genera.</p><p>Sus características más importantes son:</p><div class="chips"><div>🥁 Ritmo</div><div>🎵 Melodía</div><div>🎹 Armonía</div></div>')],
['#FF5C8A','#FF8A3D',H('Ritmo','<p>Algo tiene ritmo cuando sucede de forma <b>regular y recurrente</b>, es decir, se repite. Por ejemplo: el día y la noche, las estaciones, los días de la semana, el ciclo escolar.</p><p>En música son <b>patrones o secuencias de sonidos</b> reconocibles que aparecen varias veces en una obra. Estudiarlos hace que sean más fáciles de reconocer, recordar y reproducir.</p><div class="bars">🌞<b>›</b>🌙<b>›</b>🌞<b>›</b>🌙</div>')],
['#3DA5FF','#2ED3A5',H('Pulso','<p>Es el <b>latido regular y constante</b> de una pieza. Nos permite medir el tiempo y ubicarnos para tocar bien, solos o acompañados. Nos ordena como una grilla o una hoja cuadriculada.</p><p>Cuando cantamos el feliz cumpleaños y aplaudimos, marcamos el pulso. Ojo: no siempre hay un instrumento que lo marque, pero <b>siempre hay un pulso</b> que podemos marcar nosotros.</p><div class="bars">'+pdn(4)+'</div><div class="pl">'+B('Escuchar el pulso','pulse(this,8,100,0)')+'</div>')],
['#FFC93C','#FF8A3D',H('Compás','<p>Es la forma en que <b>agrupamos los pulsos</b>. Cada compás tiene un número fijo de pulsos. Los más comunes son los de <b>4 pulsos</b>, luego los de 2 y los de 3.</p><p>Numeramos los pulsos: uno, dos, tres, cuatro. Cuando termina el cuarto, el compás terminó y empieza uno nuevo, también con sus cuatro pulsos.</p><div class="bars">'+pdn(4)+'<b>|</b>'+pdn(4)+'</div><div class="pl">'+B('Escuchar 2 compases','pulse(this,8,100,4)')+'</div>')],
['#2ED3A5','#3DA5FF',H('Contar','<p>Una forma muy usada de contar es decir el número de pulso: “un, dos, tres, cuatro, un, dos, tres, cuatro…”.</p><p>Se suele reemplazar “cuatro” por <b>“va”</b> o <b>“cua”</b>, porque tiene una sola sílaba y facilita la cuenta.</p><p>De acá viene la costumbre de <b>contar un compás antes de empezar</b>: así todos coordinan el inicio.</p><div class="bars"><span class="pd">un</span><span class="pd">dos</span><span class="pd">tres</span><span class="pd">va</span></div><div class="pl">'+B('Cuenta de entrada','pulse(this,4,90,4)')+'</div>')],
['#6B4DE6','#3DA5FF',fin(['🥁 Ritmo: patrones que se repiten','💓 Pulso: el latido constante','📦 Compás: grupos de pulsos','🔢 Contar: un, dos, tres, va'])]]},
t2:{n:'Escribir el ritmo',e:'✍️',c:'#FF5C8A',s:[
['#FF5C8A','#6B4DE6',H('Escribir el ritmo','<p>Hay distintas maneras de poner en papel los ritmos que imaginamos o que escuchamos en la música que nos gusta.</p><p>En nuestro método <b>dividimos el compás en la cantidad de pulsos que se indique</b> y dibujamos una <b>grilla</b> para representarlo.</p>'+'<div class="bars">'+cells([0,1,0,2])+'</div>')],
['#FF8A3D','#FF5C8A',H('La grilla','<p>Por ejemplo, para representar <b>dos compases de cuatro pulsos</b>, hacemos dos grillas horizontales de cuatro cuadrados cada una.</p><div class="bars">'+blank(4)+'</div><div class="bars">'+blank(4)+'</div><p>Dentro de cada cuadrado vamos a poner un dibujo, pero no cualquiera.</p>')],
['#3DA5FF','#6B4DE6',H('Sol, barco y marinero','<p>Según la <b>cantidad de sílabas</b> de la palabra de cada dibujo, sabemos cuántos golpes dar en ese pulso:</p><div class="chips"><div>SOL<br><small>1 sílaba: 1 golpe</small></div><div>BAR-CO<br><small>2 sílabas: 2 golpes</small></div><div>MA-RI-NE-RO<br><small>4 sílabas: 4 golpes</small></div></div><div class="bars">'+cells([0,1,2])+'</div><div class="pl">'+B('Sol','pat(this,[1],70)')+B('Barco','pat(this,[2],70)')+B('Marinero','pat(this,[4],70)')+'</div>')],
['#FFC93C','#FF8A3D',H('Un ejemplo','<p>Si queremos un compás con <b>un golpe en el pulso 1, un golpe en el 2, dos golpes en el 3 y un golpe en el 4</b>, escribimos:</p><div class="bars">'+cells([0,0,1,0])+'</div><div class="pl">'+B('Escuchar','pat(this,[1,1,2,1],80)')+'</div>')],
['#2ED3A5','#3DA5FF',H('Probá vos','<p>Tocá cada cuadrado para cambiar el dibujo (sol, barco, marinero) y escuchá el ritmo que armaste.</p><div class="bars">'+ED.map((v,i)=>cell(v,`onclick="ed(this,${i})" style="cursor:pointer"`)).join('')+'</div><div class="pl">'+B('Escuchar mi ritmo','pat(this,ED.map(v=>[1,2,4][v]),80)','mt')+'</div>')],
['#6B4DE6','#FF5C8A',fin(['☀️ Sol: 1 golpe','⛵ Barco: 2 golpes','⚓ Marinero: 4 golpes','🟦 Una grilla por compás'],'ritmo','Ritmo')]]},
t3:{n:'Propiedades del sonido',e:'🔊',c:'#3DA5FF',s:[
['#3DA5FF','#6B4DE6',H('El sonido','<p>Se produce por la <b>vibración de un objeto</b> y viaja por el aire o por cualquier medio que tenga partículas.</p><p>Las ondas pasan de partícula en partícula: una mueve a la siguiente, esa a la siguiente, y así hasta llegar a nuestros oídos, que se contagian de la vibración y nos permiten percibirlo.</p><div class="bars">🎸<b>〰️</b>👂</div>'+W(4,.7,'#6B4DE6'))],
['#FF5C8A','#FF8A3D',H('Altura: grave o agudo','<p>La <b>frecuencia</b> es la cantidad de veces que algo vibra en un tiempo. Para el sonido se mide en vibraciones por segundo: <b>Hertz (Hz)</b>. Define si un sonido es grave o agudo.</p><p>Un sonido agudo vibra más veces por segundo, por eso su frecuencia es más alta.</p><p><b>AGUDO = ALTO = ALTA FRECUENCIA</b></p>'+lb('Grave: frecuencia baja')+W(2,.8,'#3DA5FF')+lb('Agudo: frecuencia alta')+W(7,.8,'#FF5C8A')+'<div class="pl">'+B('Grave',"tone(196)",'mt')+B('Agudo',"tone(784)",'pk')+'</div>')],
['#FFC93C','#FF8A3D',H('Intensidad: el volumen','<p>Es el <b>volumen</b> que percibimos. Cuanta más energía tiene la vibración, más intenso es el sonido. Por eso gritar requiere mucha energía y susurrar no.</p>'+lb('Poca energía: suave')+W(3,.25,'#3DA5FF')+lb('Mucha energía: fuerte')+W(3,1,'#FF5C8A')+'<div class="pl">'+B('Suave',"tone(330,'sine',.02)",'mt')+B('Fuerte',"tone(330,'sine',.25)",'pk')+'</div><p><small>Bajá el volumen antes de tocar “Fuerte”.</small></p>')],
['#B79BFF','#FF5C8A',H('Duración','<p>Es la <b>prolongación de un sonido en el tiempo</b>: cuántos segundos (o milisegundos) se mantiene.</p>'+lb('Corto')+'<span class="blk" style="width:30px"></span>'+lb('Largo')+'<span class="blk" style="width:210px;background:var(--mint)"></span><div class="pl">'+B('Corto',"tone(440,'sine',.12,.15)",'pk')+B('Largo',"tone(440,'sine',.12,1.8)",'mt')+'</div>')],
['#2ED3A5','#3DA5FF',H('Timbre','<p>Es la <b>riqueza y composición</b> de un sonido. Nos permite identificar cada sonido y diferenciarlos entre sí. Es lo que hace que un piano suene distinto de una trompeta.</p><p>Acá, la misma nota con tres composiciones distintas:</p>'+[['Redonda','sine'],['Cuadrada','square'],['Diente de sierra','sawtooth']].map(([n,t])=>lb(n)+W(3,.8,'#6B4DE6',t)+'<div class="pl">'+B('Escuchar',`tone(262,'${t}',.07)`)+'</div>').join(''))],
['#6B4DE6','#3DA5FF',fin(['📏 Altura: frecuencia en Hz','🔈 Intensidad: energía','⏱️ Duración: tiempo','🎻 Timbre: composición'],'cambio','Propiedades del sonido')]]},
t4:{n:'Dinámica y velocidad',e:'📈',c:'#FFC93C',s:[
['#FFC93C','#FF8A3D',H('Más que notas','<p>La música no es solo ejecutar notas o silencios en el tiempo: se enriquece cuando <b>hacemos variar las intensidades</b>.</p><p>La <b>velocidad</b> también importa. Mantenerla estable nos permite coordinar con el resto de los músicos, y además es otra forma de comunicar: no nos produce la misma sensación la música muy veloz que la lenta.</p>')],
['#FF5C8A','#6B4DE6',H('Dinámica','<p>Existen muchos símbolos para manejarla. Estos indican una intensidad que se mantiene <b>hasta que aparezca otro símbolo</b>:</p>'+sym('p','<b>Piano</b>: intensidad baja',"tone(392,'sine',.03,1)")+sym('mp mf','<b>Mezzopiano / Mezzoforte</b>: intensidad media',"tone(392,'sine',.09,1)")+sym('f','<b>Forte</b>: intensidad alta',"tone(392,'sine',.25,1)"))],
['#3DA5FF','#2ED3A5',H('Acento, crescendo y diminuendo','<p><b>Acento</b> ( &gt; ): la nota sobre la que está debe sonar más fuerte.</p><p><b>Crescendo / diminuendo</b>: la intensidad crece / decrece desde que empieza hasta que termina el símbolo.</p><svg viewBox="0 0 300 44" style="width:100%;background:#F3F0FF;border:3px solid #1F1B4D;border-radius:12px" aria-hidden="true"><g stroke="#1F1B4D" stroke-width="3" fill="none" stroke-linecap="round"><path d="M12 22L135 8M12 22L135 36"/><path d="M165 8L288 22M165 36L288 22"/></g></svg><div class="pl">'+B('Acento',"sq([[0,392,'sine',.25,.3],[450,392,'sine',.07,.3],[900,392,'sine',.07,.3],[1350,392,'sine',.07,.3]])")+B('Crescendo',"sq([.02,.05,.09,.14,.2,.28].map((g,i)=>[i*350,392,'sine',g,.3]))",'mt')+B('Diminuendo',"sq([.28,.2,.14,.09,.05,.02].map((g,i)=>[i*350,392,'sine',g,.3]))",'pk')+'</div>')],
['#2ED3A5','#3DA5FF',H('Velocidad','<p>Mantener una velocidad estable es fundamental para tocar con otros. Y cambiarla comunica: lento y rápido generan sensaciones distintas.</p><div class="bars">'+pdn(4)+'</div><div class="pl">'+B('Lento','pulse(this,8,60,0)','mt')+B('Rápido','pulse(this,16,170,0)','pk')+'</div>')],
['#B79BFF','#FF5C8A',H('Pensá y conectá','<p>Pensá en ejemplos de música que conozcas: ¿qué características tienen y qué sensaciones te producen?</p><p>Fijate si podés asociar lo que esa música te genera con alguna de estas cualidades: <b>intensidad</b> (fuerte o suave) y <b>velocidad</b> (rápida o lenta).</p>')],
['#6B4DE6','#3DA5FF',fin(['🔉 p, mp, mf, f','➡️ Acento y reguladores','📈 Crescendo / diminuendo','🐢🐇 Velocidad estable'])]]},
t5:{n:'Origen de la música',e:'🌍',c:'#FF8A3D',g:['🦴','🪨','🥁','🌿','🔥'],s:[
['#FF8A3D','#E53B3B',H('La música en la prehistoria','<p>Nuestros antepasados encontraban la música en la <b>naturaleza</b>. Primero surgió el <b>ritmo</b>, usando la voz y luego huesos y restos de animales, piedras, cañas y otros elementos del entorno.</p><p>Golpeando, entrechocando y frotando estos elementos lograban producir distintos sonidos y ejecutar ritmos primitivos.</p><div class="pl">'+B('Entrechocar piedras','stones()')+'</div>')],
['#FFC93C','#FF8A3D',H('Instrumentos más complejos','<p>Con el tiempo crearon <b>tambores</b> de troncos ahuecados y <b>sonajas</b> de quijadas de animales.</p><p>Más adelante surgió el que se considera el <b>instrumento melódico más antiguo: la flauta</b>. Las más antiguas encontradas son huesos de animales con pequeños agujeros. Luego cada cultura desarrolló sus propios instrumentos.</p><div class="tl"><div>🗣️<small>Voz</small></div><i>›</i><div>🪨<small>Objetos</small></div><i>›</i><div>🥁<small>Tambor</small></div><i>›</i><div>🪈<small>Flauta</small></div></div><div class="pl">'+B('Tambor','drum()','pk')+B('Flauta','flute()','mt')+'</div>')],
['#2ED3A5','#3DA5FF',H('¿Para qué hacían música?','<p>Como forma de <b>expresar emociones</b>, de <b>comunicarse</b> con otros miembros de la comunidad y de <b>imitar los sonidos de la naturaleza</b>.</p><p>Así enviaban mensajes al entorno, según sus creencias. Se usaba en <b>rituales</b> para pedir por lluvia, por los animales que cazaban o para evitar catástrofes climáticas.</p><p>La música y lo espiritual están ligados desde el inicio de nuestra historia.</p>')],
['#6B4DE6','#FF5C8A',fin(['🥁 Primero fue el ritmo','🪈 La flauta: el instrumento melódico más antiguo','💬 Expresar y comunicar','🙏 Rituales y creencias'])]]},
t6:{n:'El huayno',e:'⛰️',c:'#2ED3A5',g:['⛰️','🦙','🌽','☀️','🪈'],s:[
['#2ED3A5','#3DA5FF',H('El huayno','<p>Es una expresión cultural distintiva de los <b>Andes</b>, originaria de las tradiciones de música y danza de los pueblos <b>aymara y quechua</b>, antes de la llegada de los españoles.</p><p>Se originó en áreas que formaron parte del <b>Imperio Inca</b>: Perú, Ecuador, Bolivia, Chile y el norte de Argentina.</p>')],
['#FFC93C','#FF8A3D',H('Época colonial e instrumentos','<p>En la época colonial se enriqueció con elementos de la <b>música europea popular</b> de las ciudades emergentes.</p><p>Se caracteriza por su vitalidad y por expresar emociones como la alegría y el amor. Se interpreta con instrumentos autóctonos como la <b>quena</b> y la <b>zampoña</b>, a los que se suman el <b>bombo</b> y el <b>charango</b>.</p>')],
['#FF5C8A','#B79BFF',H('Danza y letras','<p>Se baila en formaciones circulares, en pareja o individualmente, y es una danza central en festividades como los <b>carnavales</b>.</p><p>Las letras tratan sobre el amor, el cortejo y el desamor.</p><p>“Huayno” es una palabra de origen quechua. Entre sus significados más difundidos están <b>“bailar de la mano”</b> y <b>“canto triste”</b>.</p>')],
['#3DA5FF','#6B4DE6',H('El ritmo del huayno','<p>Se toca en <b>compás de dos tiempos</b> y tradicionalmente alterna <b>una negra con dos corcheas</b>. En nuestro método: un SOL (1 golpe) y un BARCO (2 golpes).</p><div class="bars">'+cells([0,1])+'<b>|</b>'+cells([0,1])+'</div><div class="pl">'+B('Escuchar','pat(this,[1,2,1,2],100)')+'</div><p>Se canta en <b>coplas</b>: grupos de cuatro versos con rima en los versos pares.</p>')],
['#6B4DE6','#2ED3A5',fin(['⛰️ Andes: aymara y quechua','🪈 Quena, zampoña, bombo y charango','💃 Danza de carnavales','🥁 Dos tiempos: negra + dos corcheas'])]]}};
const TH=Object.entries(TOP).map(([id,t])=>({id,n:t.n,e:t.e,c:t.c,ready:1,total:t.s.length}));
let SL=[],gl=null,cur=0,tid=null;

function layers(i,c,gl){let s='';const r=n=>(Math.sin(i*97+n*31)*.5+.5);
[[.3,260,c[1]],[.6,180,'#fff'],[1.2,120,c[1]]].forEach(([d,z,col],k)=>s+=`<i class="ly" style="--d:${d};width:${z}px;height:${z}px;border-radius:50%;background:${col};opacity:.35;left:${r(k)*80}%;top:${r(k+5)*70}%"></i>`);
(gl||['♪','♫','♩','♬','♪']).forEach((n,k)=>s+=`<i class="ly" aria-hidden="true" style="--d:${[1.6,2.4,3.2,2,2.8][k]};font-style:normal;color:#fff;opacity:.55;font-size:${28+k*10}px;left:${r(k+9)*90}%;top:${r(k+2)*80}%">${n}</i>`);
return s+`<svg class="ly" aria-hidden="true" style="--d:.9;left:-10%;bottom:0;width:130%;height:40%" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 40Q50 0 100 40T200 40T300 40T400 40V100H0z" fill="#fff" opacity=".25"/></svg>`}
function openT(id){tid=id;SL=TOP[id].s.map(([a,b,h])=>({c:[a,b],h}));gl=TOP[id].g;const u=me();const r=u.read[id];cur=0;const v=document.createElement('div');v.className='vw';v.id='vw';
v.innerHTML=`<div class="trk" id="trk">${SL.map((s,i)=>`<section class="sl" style="background:linear-gradient(160deg,${s.c[0]},${s.c[1]})">${layers(i,s.c,gl)}<div class="card sc">${s.h}</div></section>`).join('')}</div>
<div class="vtop"><button class="btn sm gh" onclick="closeT()" aria-label="Cerrar">✕</button><div class="dots" id="dots"></div></div>
<div class="vbot"><button class="btn gh" id="pv" onclick="step(-1)">‹ Atrás</button><button class="btn" id="nx" onclick="step(1)">Siguiente ›</button></div>`;
document.body.appendChild(v);
v.addEventListener('pointermove',e=>{v.style.setProperty('--mx',((e.clientX/innerWidth-.5)*16).toFixed(1));v.style.setProperty('--my',((e.clientY/innerHeight-.5)*16).toFixed(1))});
let x0=null;v.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});v.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)step(d<0?1:-1);x0=null});
document.onkeydown=e=>{if(!$('#vw'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape')closeT()};
show()}
function step(d){const n=Math.max(0,Math.min(SL.length-1,cur+d));if(n===cur)return;cur=n;show()}
function show(){const u=me();const r=u.read[tid]=u.read[tid]||{v:[]};if(!r.v.includes(cur)){r.v.push(cur);api('read','POST',{topic:tid,slide:cur}).catch(()=>{})}
const was=r.done;if(r.v.length===SL.length){r.done=true;if(!was){toast('¡Lectura completa guardada!')}}
$('#trk').style.setProperty('--c',cur);document.querySelectorAll('.sl').forEach((s,i)=>s.style.setProperty('--o',i-cur));
$('#dots').innerHTML=SL.map((_,i)=>`<i class="${i===cur?'cur':r.v.includes(i)?'v':''}"></i>`).join('');
$('#pv').style.visibility=cur?'visible':'hidden';$('#nx').style.visibility=cur<SL.length-1?'visible':'hidden';

x;flex-direction:column;align-items:center;width:100%;flex:1}\n  #top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:720px;padding:4px 6px}\n  #lvl{display:inline-block;font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--ink);background:var(--sun);padding:4px 14px;border-radius:999px;box-shadow:0 3px 0 #c99a0a}\n  #dots{display:flex;gap:5px;margin-top:9px}\n  #dots i{width:22px;height:9px;border-radius:99px;background:rgba(255,255,255,.22)}\n  #dots i.done{background:var(--mint);box-shadow:0 0 8px rgba(59,232,176,.7)}\n  #dots i.cur{background:var(--sun);box-shadow:0 0 10px rgba(255,210,63,.9);animation:glow 1.2s ease-in-out infinite}\n  #score{font-weight:700;font-size:22px;color:var(--sun);background:rgba(7,22,52,.6);border:2px solid var(--sun);border-radius:999px;padding:5px 16px;box-shadow:0 0 14px rgba(255,210,63,.35);text-shadow:0 2px 0 rgba(0,0,0,.35)}\n  #upper{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;width:100%;position:relative;z-index:1}\n  #pattern{--gap:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);width:100%;padding:9px;background:var(--panel,rgba(6,20,48,.5));border:2px solid rgba(255,255,255,.14);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}\n  #pattern.p4{max-width:720px}\n  #pattern.p8{max-width:min(100%,560px,calc((30dvh - 28px) / .5));--gap:8px;padding:10px}\n  #pattern.p12{max-width:min(100%,560px,calc((36dvh - 30px) / .75));--gap:7px;padding:9px}\n  .card{position:relative;flex:0 0 calc((100% - 3 * var(--gap)) / 4);align-self:flex-start;aspect-ratio:1;background:#fff;border-radius:18px;border-bottom:6px solid #c9d4e6;box-shadow:0 5px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:4%;transition:background .25s,border-color .25s,box-shadow .25s}\n  .card img{width:100%;height:100%;object-fit:contain;pointer-events:none g-top:10px;font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.62);text-shadow:0 1px 0 rgba(0,0,0,.4);text-align:center}\n  .screen{--panel:rgba(6,20,48,.62);text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:9vh;padding:26px 22px 28px;width:100%;max-width:380px;background:var(--panel);border:2px solid rgba(255,255,255,.18);border-radius:32px;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 40px rgba(255,210,63,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}\n  .screen h1{margin:0;font-size:36px;line-height:1.05;color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.35);animation:zoom .7s cubic-bezier(.2,1.6,.4,1) both}\n  .screen .pts{font-size:19px;color:#bcd8ff}\n  .screen .pts b{font-size:60px;line-height:1.1;color:var(--sun);display:block;text-shadow:0 0 22px rgba(255,210,63,.6),0 4px 0 rgba(0,0,0,.35)}\n  #stars{display:flex;gap:6px;font-size:44px;line-height:1}\n  #stars span{display:inline-block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}\n  #nextHint{font-size:17px;color:#ffe9a8;min-height:1.2em}\n  .emoji{font-size:88px;line-height:1;animation:bounce 1s ease infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}\n  .big{font:inherit;font-size:21px;font-weight:700;padding:15px 30px;border:0;border-radius:18px;color:#fff;text-shadow:0 2px 0 rgba(120,30,0,.5);background:linear-gradient(#ff9a4a,#ff6a2b);box-shadow:0 7px 0 #a8310f,0 12px 18px rgba(0,0,0,.35)}\n  #fx,#flash{position:fixed;inset:0;pointer-events:none;z-index:10}\n  #flash{opacity:0}\n  @keyframes drift{to{background-position:420px 420px}}\n  @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}\n  @keyframes zoom{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}\n  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}\n\n  #lower{max-width:720px}\n  /* --- tarjetas --- */\n  #cards{position:absolute;left:2px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:20px;z-index:2}\n  .ccard{position:relative;display:block;width:50px;height:70px;padding:0;border:3px solid;border-radius:11px;cursor:pointer;font:inherit;color:#fff;transition:scale .15s,opacity .2s,filter .2s,box-shadow .2s;animation:floaty 2.6s ease-in-out infinite}\n  .ccard::after{content:'';position:absolute;inset:3px;border-radius:7px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%);pointer-events:none}\n  .ccard.y{background:linear-gradient(150deg,#fff27a,#ffd400 55%,#e8b400);border-color:#a37d00;rotate:-7deg;box-shadow:0 5px 0 #7a5d00,0 8px 14px rgba(0,0,0,.4)}\n  .ccard.r{background:linear-gradient(150deg,#ff8a80,#e53935 55%,#b71c1c);border-color:#7f0f0f;rotate:6deg;box-shadow:0 5px 0 #5c0a0a,0 8px 14px rgba(0,0,0,.4);animation-delay:-1.3s}\n  .ccard .ico{position:absolute;left:50%;top:50%;width:34px;height:34px;translate:-50% -50%;overflow:visible;pointer-events:none}\n  .ccard.r .ico{filter:drop-shadow(0 2px 0 rgba(90,0,0,.55))}\n  .ccard.y .ico{filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}\n  .cnt{position:absolute;top:-11px;right:-11px;z-index:1;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:#fff;color:#0a1f44;border:2px solid #0a1f44;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}\n  .ccard.sel{scale:1.2;box-shadow:0 0 0 4px #fff,0 0 24px 8px rgba(255,255,255,.75);animation:none}\n  .ccard.off{opacity:.4;filter:grayscale(.45);animation:none}\n  .ccard.fly{position:fixed;z-index:12;margin:0;pointer-events:none;animation:none}\n  .card.pick-y,.card.pick-r{cursor:pointer;animation:pickpulse .85s ease-in-out infinite}\n  .card.pick-y{border-bottom-color:#e8b400;box-shadow:0 0 0 3px #ffd400,0 0 22px rgba(255,212,0,.95)}\n  .card.pick-r{border-bottom-color:#e53935;box-shadow:0 0 0 3px #ff4d4d,0 0 22px rgba(255,60,60,.95)}\n  .card.dim{opacity:.32;filter:grayscale(.6)}\n  /* --- jackpot (elegante) --- */\n  .jp{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(4,6,18,.74);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}\n  .jp-panel{--rs:min(92px,21vw);position:relative;width:min(94vw,400px);padding:26px 12px 24px;border-radius:26px;text-align:center;\n    background:repeating-linear-gradient(45deg,rgba(232,195,106,.07) 0 1px,transparent 1px 15px),repeating-linear-gradient(-45deg,rgba(232,195,106,.07) 0 1px,transparent 1px 15px),linear-gradient(165deg,#1a1f3d 0%,#0d1025 100%);\n    border:1px solid rgba(232,195,106,.6);box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04) inset,0 0 70px rgba(232,190,90,.16)}\n  .orn{position:absolute;width:22px;height:22px;border:2px solid #e2b857;pointer-events:none}\n  .orn.tl{top:9px;left:9px;border-right:0;border-bottom:0;border-top-left-radius:9px}\n  .orn.tr{top:9px;right:9px;border-left:0;border-bottom:0;border-top-right-radius:9px}\n  .orn.bl{bottom:9px;left:9px;border-right:0;border-top:0;border-bottom-left-radius:9px}\n  .orn.br{bottom:9px;right:9px;border-left:0;border-top:0;border-bottom-right-radius:9px}\n  .jp-head{display:flex;align-items:center;gap:10px;padding:0 22px}\n  .jp-head .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#e2b857)}\n  .jp-head .ln.r{background:linear-gradient(270deg,transparent,#e2b857)}\n  .jp-head .dia{width:7px;height:7px;background:#e2b857;transform:rotate(45deg);flex:0 0 7px}\n  .jp-title{font-size:21px;font-weight:600;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;background:linear-gradient(#fff4d2,#dcae4f);-webkit-background-clip:text;background-clip:text;color:transparent}\n  .jp-sub{min-height:1.5em;margin:12px 0 18px;font-size:14px;letter-spacing:.05em;color:#b3b2d2}\n  .jp-machine{display:flex;align-items:stretch;justify-content:center;gap:9px}\n  .jp-reels{display:flex;gap:8px;padding:10px;background:#090b1b;border-radius:16px;border:1px solid rgba(232,195,106,.4);box-shadow:inset 0 2px 14px rgba(0,0,0,.85),0 0 24px rgba(232,195,106,.1)}\n  .reel{width:var(--rs);height:var(--rs);overflow:hidden;border-radius:12px;background:#f6f3ec;position:relative;box-shadow:inset 0 9px 10px -5px rgba(0,0,0,.4),inset 0 -9px 10px -5px rgba(0,0,0,.4)}\n  .strip{display:flex;flex-direction:column;will-change:transform;transition:filter .25s}\n  .cell{flex:0 0 var(--rs);height:var(--rs);padding:10%;display:flex;align-items:center;justify-content:center}\n  .cell img{width:100%;height:100%;object-fit:contain}\n  .reel.win{animation:reelwin .5s ease-in-out 4}\n  .jp-lever{position:relative;flex:0 0 34px;width:34px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}\n  .jp-lever .rail{position:absolute;left:50%;top:4px;bottom:4px;width:10px;margin-left:-5px;border-radius:5px;background:linear-gradient(90deg,#070918,#2b3158 50%,#070918);border:1px solid rgba(232,195,106,.4)}\n  .jp-lever .knob{position:absolute;left:50%;top:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a0,#dcab42 58%,#8c6414);box-shadow:0 3px 0 #5a3f0e,0 7px 12px rgba(0,0,0,.55)}\n  .jp-lever.ready .knob{animation:leverhint 1.4s ease-in-out infinite}\n  .jp-lever.used{cursor:default;pointer-events:none}\n  .jp-rule{position:relative;height:1px;margin:20px 16px 18px;background:linear-gradient(90deg,transparent,rgba(232,195,106,.65),transparent)}\n  .jp-rule i{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;background:#e2b857;transform:rotate(45deg)}\n  .jp-slot{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}\n  .jp-stop{font:inherit;font-size:16px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;padding:15px 0 15px .34em;width:82%;border-radius:999px;border:1px solid #f0cd7c;color:#1d1503;background:linear-gradient(#f8e1a2,#d8a53a);box-shadow:0 5px 0 #8c6414,0 12px 20px rgba(0,0,0,.45);touch-action:none;outline:none;-webkit-user-select:none;user-select:none;opacity:.32;pointer-events:none;transition:opacity .25s}\n  .jp-stop.on{opacity:1;pointer-events:auto}\n  .jp-stop.gone{display:none}\n  .jp-result{font-size:23px;font-weight:600;letter-spacing:.06em;line-height:1.15;color:#f3e6c4;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:5px}\n  .jp-result small{font-size:14px;font-weight:500;letter-spacing:.08em;color:#d3c59e}\n  .jp-result.none{font-size:18px;font-weight:500;color:#b3b2d2}\n  .jp-result.gd{color:#f6d889}.jp-result.yw{color:#ffe27a}.jp-result.rd{color:#ff9d9d}\n  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -5px}}\n  @keyframes pickpulse{0%,100%{scale:1}50%{scale:1.09}}\n  @keyframes reelwin{0%,100%{box-shadow:inset 0 9px 10px -5px rgba(0,0,0,.4),inset 0 -9px 10px -5px rgba(0,0,0,.4)}50%{box-shadow:inset 0 0 18px rgba(232,195,106,.9),0 0 22px 6px rgba(232,195,106,.9)}}\n  @keyframes leverhint{0%,100%{translate:0 0;filter:brightness(1)}50%{translate:0 10px;filter:brightness(1.25)}}\n<\/style><\/head><body class=\"lv0\">\n<div id=\"bg\"><\/div>\n<svg id=\"waves\" viewBox=\"0 0 400 90\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n  <path d=\"M0 40 Q50 18 100 40 T200 40 T300 40 T400 40 V90 H0Z\" fill=\"rgba(255,255,255,.07)\"/>\n  <path d=\"M0 58 Q50 38 100 58 T200 58 T300 58 T400 58 V90 H0Z\" fill=\"rgba(255,255,255,.07)\"/>\n  <path d=\"M0 74 Q50 58 100 74 T200 74 T300 74 T400 74 V90 H0Z\" fill=\"rgba(6,20,48,.35)\"/>\n<\/svg>\n<canvas id=\"fx\"><\/canvas><div id=\"flash\"><\/div>\n<div id=\"play\">\n  <div id=\"top\">\n    <div><div id=\"lvl\"><\/div><div id=\"dots\"><\/div><\/div>\n    <div id=\"score\">⭐ 0<\/div>\n  <\/div>\n  <div id=\"upper\">\n    <div id=\"pattern\"><\/div>\n    <div id=\"msg\"><\/div>\n  <\/div>\n  <div id=\"lower\">\n    <button id=\"listen\" type=\"button\">🔊 Escuchar una vez<\/button>\n    <div id=\"cards\">\n      <button class=\"ccard y\" id=\"cardY\" hidden title=\"Tarjeta amarilla: convierte un barco o marinero en sol\"><span class=\"cnt\">0<\/span><\/button>\n      <button class=\"ccard r\" id=\"cardR\" hidden title=\"Tarjeta roja: elimina un pulso\"><span class=\"cnt\">0<\/span><\/button>\n    <\/div>\n    <button id=\"tap\">TAP<\/button>\n  <\/div>\n<\/div>\n<div id=\"levelDone\" class=\"screen\" hidden>\n  <div class=\"emoji\" id=\"lvlEmoji\">🎉<\/div>\n  <div id=\"stars\"><span>⭐<\/span><span>⭐<\/span><span>⭐<\/span><\/div>\n  <h1 id=\"levelDoneTitle\"><\/h1>\n  <div class=\"pts\">Puntaje del nivel<b id=\"levelPts\"><\/b><\/div>\n  <div id=\"nextHint\"><\/div>\n  <button id=\"nextLevel\" class=\"big\">Pasar al siguiente nivel<\/button>\n<\/div>\n<div id=\"finished\" class=\"screen\" hidden>\n  <div class=\"emoji\">🏆<\/div>\n  <h1>¡Completaste todos los niveles!<\/h1>\n  <div class=\"pts\">Puntaje final<b id=\"finalPts\"><\/b><\/div>\n  <p style=\"margin:0;opacity:.85\">Incluye +50 de bonus por terminar 🏆<\/p>\n  <button id=\"restart\" class=\"big\">Volver a empezar<\/button>\n<\/div>\n<div id=\"jackpot\" class=\"jp\" hidden>\n  <div class=\"jp-panel\">\n    <span class=\"orn tl\"><\/span><span class=\"orn tr\"><\/span><span class=\"orn bl\"><\/span><span class=\"orn br\"><\/span>\n    <div class=\"jp-head\"><i class=\"ln\"><\/i><i class=\"dia\"><\/i><div class=\"jp-title\">Jackpot<\/div><i class=\"dia\"><\/i><i class=\"ln r\"><\/i><\/div>\n    <div class=\"jp-sub\" id=\"jpSub\"><\/div>\n    <div class=\"jp-machine\">\n      <div class=\"jp-reels\">\n        <div class=\"reel\"><div class=\"strip\"><\/div><\/div>\n        <div class=\"reel\"><div class=\"strip\"><\/div><\/div>\n        <div class=\"reel\"><div class=\"strip\"><\/div><\/div>\n      <\/div>\n      <div class=\"jp-lever\" id=\"jpLever\"><div class=\"rail\"><\/div><div class=\"knob\"><\/div><\/div>\n    <\/div>\n    <div class=\"jp-rule\"><i><\/i><\/div>\n    <div class=\"jp-slot\">\n      <button class=\"jp-stop\" id=\"jpStop\">Detener<\/button>\n      <div class=\"jp-result\" id=\"jpResult\"><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<footer>Tomás Jibaja - Profesor de Música<\/footer>\n<script>\n// Tolerancia para ACERTAR: max(MIN_TOLERANCE_MS, TOLERANCE_RATIO * intervalo esperado entre golpes consecutivos).\n// (Calibrada por simulación: un jugador con ±30 ms de imprecisión al tocar pasa ~87-92 % de los ejercicios de los niveles 2 a 4.)\nconst TOLERANCE_RATIO = 0.65;\nconst MIN_TOLERANCE_MS = 130;\n// Referencia para el PUNTAJE (la tolerancia anterior): pasar es más fácil, pero los 10 puntos siguen premiando la precisión.\nconst SCORE_REF_RATIO = 0.40;\nconst SCORE_REF_MIN_MS = 40;\nconst UNITS_PER_BEAT = 4;        // 1 pulso = 4 unidades (semicorcheas)\nconst ALLOWED_SUBDIVISIONS = [1, 2, 4]; // SOL, BARCO, MARINERO\n\n// Cierre del ejercicio (solo captura, no afecta la evaluación)\nconst FIRST_HIT_TIMEOUT_MS = 3000; // 1 solo golpe y silencio\nconst INCOMPLETE_WAIT_MIN_MS = 3000; // faltan golpes: espera generosa antes de rendirse\nconst INCOMPLETE_WAIT_BEATS = 4;\nconst EXTRA_WAIT_MIN_MS = 600;   // patrón completo: ventana para detectar golpes de más\nconst EXTRA_WAIT_MAX_MS = 1500;\n\n// Puntaje por ejercicio acertado: mínimo al pasar justo en el límite de tolerancia, máximo si es perfecto.\nconst FINISH_BONUS = 50;   // bonus por llegar al final y ganar\nconst SCORE_MIN_PASS = 4;\nconst SCORE_MAX = 10;\n\n// Jackpot y tarjetas\n// Probabilidad de que aparezca el jackpot tras un ejercicio acertado.\nconst JACKPOT_CHANCE = 0.15;\n// Probabilidades del giro (dentro del jackpot): tres soles / tres barcos / tres marineros. El resto = nada.\n// Nivel 1 usa ODDS_START (25 % cada opción, 25 % nada) y van pasando gradualmente (lineal) hasta ODDS_FINAL en el último nivel.\nconst ODDS_START = { double: 0.25, yellow: 0.25, red: 0.25 };  // nivel 1 -> nada = 25 %\nconst ODDS_FINAL = { double: 0.20, yellow: 0.15, red: 0.10 };  // último nivel -> nada = 55 %\nconst MAX_CARDS = 3;         // máximo de tarjetas acumulables de cada color\nconst MIN_PULSES = 2;        // la tarjeta roja no deja un ejercicio con menos pulsos que esto\nconst STOP_GAP_MS = 250;     // un toque en DETENER: cada rodillo empieza a frenar al menos esto después del anterior\nconst LAND_GAP_MS = 330;     // ...y aterriza al menos esto después del anterior (se detienen en orden, de izquierda a derecha)\n\n// Diagnóstico de errores: tendencia a apurarse / atrasarse (cociente entre el tempo de la 2ª mitad y el de la 1ª)\nconst TREND_RUSH_RATIO = 0.85;  // < 0,85 => se fue apurando\nconst TREND_DRAG_RATIO = 1.18;  // > 1,18 => se fue atrasando\nconst TREND_MIN_HITS = 8;       // con menos golpes no se evalúa la tendencia (cada mitad necesita >= 4 golpes)\n\n\n/** Genera un patrón aleatorio válido, p.ej. [1,2,1,4]. `rng` inyectable para tests. */\nfunction generateExercise(length, rng = Math.random, allowed = ALLOWED_SUBDIVISIONS) {\n  return Array.from({ length }, () => allowed[Math.floor(rng() * allowed.length)]);\n}\n\n/** Patrón -> posiciones de golpe en unidades de 1/4 de pulso. */\nfunction patternToGrid(pattern) {\n  const grid = [];\n  pattern.forEach((hits, beat) => {\n    if (!ALLOWED_SUBDIVISIONS.includes(hits)) throw new Error(`Subdivisión inválida: ${hits}`);\n    const step = UNITS_PER_BEAT / hits;\n    for (let i = 0; i < hits; i++) grid.push(beat * UNITS_PER_BEAT + i * step);\n  });\n  return grid;\n}\n\n/** beatDuration = realInterval * (4 / gridDistance), sin casos especiales. */\nfunction estimateBeatDuration(pattern, firstHitTime, secondHitTime) {\n  const grid = patternToGrid(pattern);\n  if (grid.length < 2) throw new Error('El patrón necesita al menos 2 golpes');\n  const realInterval = secondHitTime - firstHitTime;\n  if (!(realInterval > 0)) throw new Error('La segunda pulsación debe ser posterior a la primera');\n  const gridDistance = grid[1] - grid[0];\n  return realInterval * (UNITS_PER_BEAT / gridDistance);\n}\n\n/** Tiempos absolutos esperados (ms) con la 1ª pulsación como origen. (Referencia/diagnóstico) */\nfunction getExpectedHits(pattern, firstHitTime, beatDuration) {\n  const unit = beatDuration / UNITS_PER_BEAT;\n  return patternToGrid(pattern).map(p => firstHitTime + p * unit);\n}\n\n/** Duración esperada (ms) entre cada golpe y su antecesor. Longitud = golpes - 1. */\nfunction getExpectedIntervals(pattern, beatDuration) {\n  const grid = patternToGrid(pattern);\n  const unit = beatDuration / UNITS_PER_BEAT;\n  return grid.slice(1).map((p, i) => (p - grid[i]) * unit);\n}\n\n/** Tolerancia (ms) para un intervalo esperado: proporcional, con piso mínimo. */\nfunction getTolerance(expectedGap, ratio = TOLERANCE_RATIO, minMs = MIN_TOLERANCE_MS) {\n  return Math.max(minMs, expectedGap * ratio);\n}\n\n/**\n * Cada golpe se mide contra el golpe REAL anterior (los errores no se acumulan).\n * El 2º golpe define el tempo, así que su intervalo coincide por construcción.\n * Devuelve { ok, reason: 'ok'|'missing'|'extra'|'timing', gaps:[{expected,actual,error,tol,ok}], details }.\n */\nfunction evaluatePerformance(expectedGaps, actualHits, ratio = TOLERANCE_RATIO, minMs = MIN_TOLERANCE_MS) {\n  const expectedCount = expectedGaps.length + 1;\n  const gaps = expectedGaps.map((expected, i) => {\n    if (i + 1 >= actualHits.length) return null;\n    const actual = actualHits[i + 1] - actualHits[i];\n    const tol = getTolerance(expected, ratio, minMs);\n    const error = actual - expected;\n    return { expected, actual, error, tol, ok: Math.abs(error) <= tol };\n  });\n  const badIdx = gaps.map((g, i) => g && !g.ok ? i + 1 : -1).filter(i => i >= 0);\n  const missing = Math.max(0, expectedCount - actualHits.length);\n  const extra = Math.max(0, actualHits.length - expectedCount);\n  let reason = 'ok';\n  if (missing) reason = 'missing';\n  else if (extra) reason = 'extra';\n  else if (badIdx.length) reason = 'timing';\n  return { ok: reason === 'ok', reason, gaps, details: { missing, extra, badIdx } };\n}\n\n/** Atajo: evalúa una ejecución completa a partir de los timestamps crudos. */\nfunction evaluateAttempt(pattern, actualHits, ratio = TOLERANCE_RATIO, minMs = MIN_TOLERANCE_MS) {\n  if (actualHits.length < 2) {\n    return { ok: false, reason: 'missing', gaps: [], details: { missing: patternToGrid(pattern).length - actualHits.length, extra: 0, badIdx: [] } };\n  }\n  if (!(actualHits[1] > actualHits[0])) { // toques simultáneos o desordenados: no hay tempo que estimar\n    return { ok: false, reason: 'timing', gaps: [], details: { missing: 0, extra: 0, badIdx: [1] } };\n  }\n  const beat = estimateBeatDuration(pattern, actualHits[0], actualHits[1]);\n  const result = evaluatePerformance(getExpectedIntervals(pattern, beat), actualHits, ratio, minMs);\n  return { ...result, beatDuration: beat };\n}\n\n\n/**\n * Puntos de un intento: 0 si falló; si acertó, entre SCORE_MIN_PASS y SCORE_MAX\n * según qué tan cerca estuvo cada golpe de su tiempo esperado (error / tolerancia de referencia).\n * El 1er intervalo se excluye: define el tempo, su error es 0 por construcción.\n */\nfunction scoreAttempt(result) {\n  if (!result.ok) return 0;\n  const gaps = result.gaps.slice(1).filter(Boolean);\n  // La precisión se mide contra una tolerancia de referencia (más exigente que la de acierto)\n  const refTol = g => Math.max(SCORE_REF_MIN_MS, g.expected * SCORE_REF_RATIO);\n  const meanErr = gaps.length\n    ? gaps.reduce((sum, g) => sum + Math.min(1, Math.abs(g.error) / refTol(g)), 0) / gaps.length\n    : 0;\n  return SCORE_MIN_PASS + Math.round((SCORE_MAX - SCORE_MIN_PASS) * (1 - meanErr));\n}\n\n// Captura de pulsaciones + cierre del ejercicio. Sin DOM: solo recibe hits.\n\n\n/** Cuánto esperar tras el último golpe antes de cerrar. Nunca cierra a mitad de un ejercicio normal. */\nfunction getCloseDelay(pattern, hits) {\n  if (hits.length < 2) return FIRST_HIT_TIMEOUT_MS;\n  const beat = estimateBeatDuration(pattern, hits[0], hits[1]);\n  const total = patternToGrid(pattern).length;\n  if (hits.length < total) return Math.max(INCOMPLETE_WAIT_MIN_MS, beat * INCOMPLETE_WAIT_BEATS);\n  return Math.min(EXTRA_WAIT_MAX_MS, Math.max(EXTRA_WAIT_MIN_MS, beat)); // ventana para golpes de más\n}\n\nfunction createRecorder(pattern, onFinish) {\n  const hits = [];\n  let timer = null, done = false;\n  function finish() {\n    done = true;\n    onFinish(evaluateAttempt(pattern, hits.slice()), hits.slice());\n  }\n  return {\n    hit(t = performance.now()) {\n      if (done) return;\n      hits.push(t);\n      clearTimeout(timer);\n      timer = setTimeout(finish, getCloseDelay(pattern, hits));\n    },\n    count: () => hits.length,\n    cancel() { done = true; clearTimeout(timer); },\n  };\n}\n\n// Estado de niveles/ejercicios y puntaje. Sin DOM ni tiempos: solo progreso.\n\n\n// allowed: subdivisiones permitidas (1 = SOL, 2 = BARCO, 4 = MARINERO)\n// growOnError: cada error agrega un pulso al ejercicio actual, hasta maxBeats.\nconst LEVELS = [\n  { beats: 4, exercises: 7, allowed: [1, 2], intro: null },\n  { beats: 4, exercises: 7, allowed: [1, 2, 4], intro: 'Entra el marinero ⚓' },\n  { beats: 8, exercises: 7, allowed: [1, 2, 4], intro: 'Ahora son 8 pulsos' },\n  { beats: 8, exercises: 7, allowed: [1, 2, 4], growOnError: true, maxBeats: 12, intro: 'Cada error suma un pulso (hasta 12)' },\n];\n\n/** status: 'playing' | 'levelComplete' | 'finished' */\nfunction createGame(rng = Math.random) {\n  const g = { level: 0, index: 0, pattern: null, status: 'playing', levelScores: LEVELS.map(() => 0), cards: { yellow: 0, red: 0 } };\n  const cfg = () => LEVELS[g.level];\n  const newPattern = () => { g.pattern = generateExercise(cfg().beats, rng, cfg().allowed); };\n  newPattern();\n  return {\n    state: () => ({\n      level: g.level, index: g.index, status: g.status, pattern: g.pattern.slice(),\n      totalExercises: cfg().exercises,\n      isLastLevel: g.level === LEVELS.length - 1,\n      levelScore: g.levelScores[g.level],\n      levelMax: cfg().exercises * SCORE_MAX,\n      score: g.levelScores.reduce((a, b) => a + b, 0),\n      cards: { ...g.cards },\n      totalMax: LEVELS.reduce((a, l) => a + l.exercises * SCORE_MAX, 0),\n    }),\n    /**\n     * Acierto: suma puntos y avanza (devuelve false).\n     * Fallo: mismo ejercicio; en niveles growOnError agrega un pulso (devuelve true si lo agregó).\n     */\n    submit(ok, points = 0) {\n      if (g.status !== 'playing') return false;\n      if (!ok) {\n        if (cfg().growOnError && g.pattern.length < cfg().maxBeats) {\n          g.pattern.push(...generateExercise(1, rng, cfg().allowed));\n          return true;\n        }\n        return false;\n      }\n      g.levelScores[g.level] += points;\n      g.index++;\n      if (g.index >= cfg().exercises) {\n        g.status = g.level === LEVELS.length - 1 ? 'finished' : 'levelComplete';\n      } else newPattern();\n      return false;\n    },\n    /** Suma una tarjeta ('yellow' | 'red'). Devuelve false si ya hay MAX_CARDS (no se suma). */\n    addCard(color) {\n      if (!(color in g.cards) || g.cards[color] >= MAX_CARDS) return false;\n      g.cards[color]++;\n      return true;\n    },\n    /** Amarilla: convierte en SOL el pulso i del ejercicio actual (solo barco o marinero). */\n    useYellow(i) {\n      if (g.status !== 'playing' || g.cards.yellow < 1) return false;\n      if (!(i >= 0 && i < g.pattern.length) || g.pattern[i] === 1) return false;\n      g.pattern[i] = 1; g.cards.yellow--;\n      return true;\n    },\n    /** Roja: elimina el pulso i del ejercicio actual (nunca deja menos de MIN_PULSES). */\n    useRed(i) {\n      if (g.status !== 'playing' || g.cards.red < 1) return false;\n      if (!(i >= 0 && i < g.pattern.length) || g.pattern.length <= MIN_PULSES) return false;\n      g.pattern.splice(i, 1); g.cards.red--;\n      return true;\n    },\n    nextLevel() {\n      if (g.status !== 'levelComplete') return;\n      g.level++; g.index = 0; g.status = 'playing'; newPattern();\n    },\n    /** Retomar una partida guardada: arranca en `level`. Los puntos ya acumulados se cargan en el nivel 1 solo para mostrar el total. */\n    resume(level, score = 0) {\n      g.level = Math.max(0, Math.min(LEVELS.length - 1, level | 0)); g.index = 0; g.status = 'playing';\n      g.levelScores = LEVELS.map(() => 0); if (g.level > 0) g.levelScores[0] = score;\n      g.cards = { yellow: 0, red: 0 }; newPattern();\n    },\n    restart() {\n      g.level = 0; g.index = 0; g.status = 'playing'; g.levelScores = LEVELS.map(() => 0); g.cards = { yellow: 0, red: 0 }; newPattern();\n    },\n  };\n}\n\n// Diagnóstico de un intento fallido (sin DOM): ¿qué figuras salieron mal y qué tendencia hubo?\n\n\n/** Para cada golpe esperado, índice de la figura (pulso) a la que pertenece. [1,2,4] -> [0,1,1,2,2,2,2] */\nfunction pulseOfHits(pattern) {\n  const out = [];\n  pattern.forEach((n, p) => { for (let i = 0; i < n; i++) out.push(p); });\n  return out;\n}\n\nconst median = arr => { const s = [...arr].sort((p, q) => p - q), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };\n\n// Recta robusta (Theil-Sen: mediana de pendientes): tiempo = a + b * posición en la grilla.\n// Es robusta a uno o dos golpes muy corridos, que con mínimos cuadrados arrastrarían la recta y harían\n// parecer \"mal\" a golpes que estuvieron bien.\nfunction fit(xs, ys) {\n  const slopes = [];\n  for (let i = 0; i < xs.length; i++) for (let j = i + 1; j < xs.length; j++) if (xs[j] !== xs[i]) slopes.push((ys[j] - ys[i]) / (xs[j] - xs[i]));\n  const b = slopes.length ? median(slopes) : 0;\n  return { a: median(ys.map((y, i) => y - b * xs[i])), b };\n}\nconst residuals = (xs, ys) => { const { a, b } = fit(xs, ys); return ys.map((y, i) => y - (a + b * xs[i])); };\nconst rms = r => Math.sqrt(r.reduce((s, v) => s + v * v, 0) / r.length);\n\n\n// Tempo (ms por unidad de grilla) de un tramo: mediana de pendientes entre pares de golpes separados >= minSep unidades.\nfunction halfTempo(grid, hits, lo, hi, minSep) {\n  const sl = [];\n  for (let i = lo; i <= hi; i++) for (let j = i + 1; j <= hi; j++) if (grid[j] - grid[i] >= minSep) sl.push((hits[j] - hits[i]) / (grid[j] - grid[i]));\n  return sl.length >= 2 ? median(sl) : null;\n}\n\n/**\n * ¿Se fue apurando o atrasando? Compara el tempo de la 2ª mitad del ejercicio con el de la 1ª, midiendo cada\n * mitad con la mediana de pendientes entre golpes separados al menos un pulso. Al ser robusto, un golpe suelto\n * corrido no se confunde con una tendencia (en simulación: 0 % de falsos positivos y ~99 % de detección de derivas reales).\n */\nfunction trend(grid, hits) {\n  const n = grid.length;\n  if (n < TREND_MIN_HITS || hits.length !== n) return null;\n  const mid = (grid[0] + grid[n - 1]) / 2;\n  let k = 0;\n  for (let i = 0; i < n; i++) if (grid[i] <= mid) k = i;\n  k = Math.min(Math.max(k, 2), n - 3);\n  const t1 = halfTempo(grid, hits, 0, k, 4), t2 = halfTempo(grid, hits, k + 1, n - 1, 4); // mitades disjuntas\n  if (!(t1 > 0) || !(t2 > 0)) return null;\n  const ratio = t2 / t1;\n  return ratio < TREND_RUSH_RATIO ? 'rushing' : ratio > TREND_DRAG_RATIO ? 'dragging' : null;\n}\n\n/**\n * Devuelve { badPulses: [índices de figura], tendency: 'rushing'|'dragging'|null,\n *            side: 'early'|'late'|'mixed'|null, detail: 'timing'|'missing-one'|'missing-many'|'extra-one'|'extra-many' }.\n * `res` es el resultado de evaluateAttempt (res.reason, res.gaps).\n */\nfunction diagnoseAttempt(pattern, hits, res) {\n  const grid = patternToGrid(pattern), pulse = pulseOfHits(pattern), n = grid.length, m = hits.length;\n  const out = { badPulses: [], tendency: null, side: null, detail: res.reason };\n  const pulses = idxs => [...new Set(idxs.map(i => pulse[Math.min(Math.max(i, 0), n - 1)]))].sort((a, b) => a - b);\n\n  if (res.reason === 'missing') {\n    out.detail = 'missing-many';\n    let at = Math.min(m, n - 1); // por defecto: la primera figura que no se llegó a tocar\n    if (n - m === 1 && m >= 3) { // falta un solo golpe: ¿en cuál posición encaja mejor?\n      let best = Infinity;\n      for (let j = 0; j < n; j++) {\n        const idx = hits.map((_, k) => (k < j ? k : k + 1));\n        const s = rms(residuals(idx.map(i => grid[i]), hits));\n        if (s <= best + 1e-6) { best = Math.min(best, s); at = j; } // en empate gana el último (se cortó al final)\n      }\n      out.detail = 'missing-one';\n    }\n    out.badPulses = pulses([at]);\n  } else if (res.reason === 'extra') {\n    out.detail = 'extra-many';\n    let at = n - 1; // por defecto: sobraron al final\n    if (m - n === 1 && n >= 3) { // sobra un solo golpe: ¿cuál es?\n      let best = Infinity;\n      for (let k = 0; k < m; k++) {\n        const ys = hits.filter((_, i) => i !== k);\n        const s = rms(residuals(grid, ys));\n        if (s <= best + 1e-6) { best = Math.min(best, s); at = k; } // en empate gana el último (sobró al final)\n      }\n      out.detail = 'extra-one';\n    }\n    out.badPulses = pulses([at]);\n  } else { // timing (misma cantidad de golpes)\n    out.detail = 'timing';\n    if (m !== n || !res.gaps || !res.gaps.length) { out.badPulses = pulses([1]); return out; }\n    const r = residuals(grid, hits);\n    const culprits = new Set();\n    res.gaps.forEach((g, i) => {\n      if (g && !g.ok) culprits.add(Math.abs(r[i]) > Math.abs(r[i + 1]) ? i : i + 1); // el golpe más desviado de los dos\n    });\n    if (!culprits.size) culprits.add(r.reduce((bi, v, i) => (Math.abs(v) > Math.abs(r[bi]) ? i : bi), 0));\n    const list = [...culprits];\n    out.badPulses = pulses(list);\n    const signs = list.map(i => Math.sign(r[i]));\n    out.side = signs.every(s => s < 0) ? 'early' : signs.every(s => s > 0) ? 'late' : 'mixed';\n    out.tendency = trend(grid, hits);\n  }\n  return out;\n}\n\n/** Texto corto del aviso según el diagnóstico. */\nfunction failureText(diag) {\n  switch (diag.detail) {\n    case 'missing-one': return 'Faltó un golpe en la figura marcada.';\n    case 'missing-many': return 'Faltaron golpes (desde la figura marcada).';\n    case 'extra-one': return 'Sobró un golpe en la figura marcada.';\n    case 'extra-many': return 'Hubo golpes de más (después de la figura marcada).';\n    default:\n      if (diag.tendency === 'rushing') return 'Te fuiste apurando hacia el final.';\n      if (diag.tendency === 'dragging') return 'Te fuiste atrasando hacia el final.';\n      if (diag.side === 'early') return 'Las figuras marcadas salieron adelantadas.';\n      if (diag.side === 'late') return 'Las figuras marcadas salieron atrasadas.';\n      return 'Revisá las figuras marcadas.';\n  }\n}\n\n// Lógica pura del jackpot (sin DOM). 1 = SOL, 2 = BARCO, 4 = MARINERO.\n\nconst SYMBOLS = [1, 2, 4];\n\n/** ¿Sale el jackpot tras este ejercicio? */\nfunction rollsJackpot(rng = Math.random, chance = JACKPOT_CHANCE) {\n  return rng() < chance;\n}\n\n/**\n * Probabilidades del giro para un nivel (0 = primero): arrancan en ODDS_START y van\n * hacia ODDS_FINAL de forma lineal. Devuelve { double, yellow, red, none } (suman 1).\n */\nfunction oddsForLevel(level, totalLevels) {\n  const t = totalLevels > 1 ? Math.min(1, Math.max(0, level / (totalLevels - 1))) : 1;\n  const mix = k => ODDS_START[k] + (ODDS_FINAL[k] - ODDS_START[k]) * t;\n  const odds = { double: mix('double'), yellow: mix('yellow'), red: mix('red') };\n  odds.none = 1 - odds.double - odds.yellow - odds.red;\n  return odds;\n}\n\n/** Sortea el resultado del giro: 'double' | 'yellow' | 'red' | 'none'. */\nfunction rollOutcome(rng = Math.random, odds = oddsForLevel(1, 1)) {\n  const u = rng();\n  let acc = odds.double;\n  if (u < acc) return 'double';\n  acc += odds.yellow;\n  if (u < acc) return 'yellow';\n  acc += odds.red;\n  if (u < acc) return 'red';\n  return 'none';\n}\n\n/** Símbolos en que deben detenerse los tres rodillos para mostrar ese resultado. */\nfunction reelsFor(type, rng = Math.random) {\n  const triple = { double: 1, yellow: 2, red: 4 }[type];\n  if (triple) return [triple, triple, triple];\n  const nonTriples = [];\n  for (const a of SYMBOLS) for (const b of SYMBOLS) for (const c of SYMBOLS) if (!(a === b && b === c)) nonTriples.push([a, b, c]);\n  return nonTriples[Math.floor(rng() * nonTriples.length)];\n}\n\n/** Tres soles: puntos x2 · tres barcos: tarjeta amarilla · tres marineros: tarjeta roja · otra cosa: nada. */\nfunction evaluateReels(reels) {\n  const [a, b, c] = reels;\n  if (a !== b || b !== c) return { type: 'none' };\n  return { 1: { type: 'double' }, 2: { type: 'yellow' }, 4: { type: 'red' } }[a];\n}\n\n// Física de los rodillos del jackpot (sin DOM).\n// `pos` es la posición en \"celdas\": cuando es un entero i, en la ventana se ve el símbolo ORDER[i mod 3].\n\n\nconst ORDER = SYMBOLS; // [SOL, BARCO, MARINERO], en el orden en que desfilan\n\n/** Símbolo que se ve en la ventana cuando el rodillo está clavado en `pos` (entero). */\nfunction symbolAt(pos) {\n  const n = ORDER.length;\n  return ORDER[((Math.round(pos) % n) + n) % n];\n}\n\n/**\n * Plan de frenado al apretar DETENER: el rodillo desacelera de forma constante hasta clavarse\n * en la próxima celda que está al menos 0,5 celda adelante (el símbolo que \"viene entrando\").\n * Si `forced` (el símbolo objetivo sorteado) no es null, sigue de largo hasta la primera celda con ese símbolo.\n */\nfunction planStop(pos, speed, forced = null) {\n  let target = Math.ceil(pos + 0.5);\n  if (forced !== null) {\n    let guard = 0;\n    while (symbolAt(target) !== forced && guard++ < ORDER.length) target++;\n  }\n  const dist = target - pos;\n  return { target, dist, duration: (2 * dist) / speed }; // duración en segundos\n}\n\n/** Posición durante el frenado (desaceleración constante, llega a `target` con velocidad 0). */\nfunction brakePos(p0, v0, duration, t) {\n  const k = Math.min(Math.max(t, 0), duration);\n  return p0 + v0 * k - (v0 / (2 * duration)) * k * k;\n}\n\n/**\n * Un toque en DETENER frena los tres rodillos EN ORDEN. Devuelve el plan de frenado del rodillo `k`\n * si ya le toca empezar a frenar (null si todavía no): espera su turno (k * STOP_GAP_MS desde el toque)\n * y, si  d: 0.18, type: 'sine', vol: 0.05 });\n}\n\n/** Error: \"wah-wah\" descendente + golpe grave. Breve, de mala onda. */\nfunction playError() {\n  [[392, 0], [370, 0.11], [330, 0.22]].forEach(([f, t]) => tone(f, { t, d: 0.12, type: 'sawtooth', vol: 0.1 }));\n  tone(247, { t: 0.34, f2: 98, d: 0.34, type: 'sawtooth', vol: 0.13 });\n  tone(70, { t: 0.34, d: 0.3, type: 'sine', vol: 0.25 });\n}\n\n/** Nivel completado: dos arpegios ascendentes, acorde brillante y destellos. */\nfunction playLevelUp() {\n  [523, 659, 784, 1047].forEach((f, i) => tone(f, { t: i * 0.09, d: 0.14, type: 'square', vol: 0.1 }));\n  [659, 784, 1047, 1319].forEach((f, i) => tone(f, { t: 0.4 + i * 0.09, d: 0.14, type: 'square', vol: 0.1 }));\n  [1047, 1319, 1568, 2093].forEach(f => tone(f, { t: 0.82, d: 0.9, vol: 0.13 }));\n  [3136, 3520, 4186].forEach((f, i) => tone(f, { t: 0.95 + i * 0.1, d: 0.3, type: 'sine', vol: 0.045 }));\n  tone(262, { t: 0.82, d: 0.8, type: 'sine', vol: 0.18 });\n}\n\n/** Juego completado: escala, fanfarria con acordes y remate triunfal. */\nfunction playWin() {\n  [523, 587, 659, 698, 784, 880, 988, 1047].forEach((f, i) => tone(f, { t: i * 0.085, d: 0.13, type: 'square', vol: 0.09 }));\n  [[1047, 1319, 1568], [1175, 1480, 1760], [1319, 1568, 1976]].forEach((ch, k) =>\n    ch.forEach(f => tone(f, { t: 0.75 + k * 0.28, d: 0.3, vol: 0.12 })));\n  [[1047, 1319, 1568, 2093], [1047, 1319, 1568, 2093]].forEach((ch, k) =>\n    ch.forEach(f => tone(f, { t: 1.65 + k * 0.1, d: 1.6 - k * 0.1, vol: 0.12 })));\n  tone(262, { t: 1.65, d: 1.6, type: 'sine', vol: 0.2 });\n  [3136, 3951, 4186, 3520, 4698].forEach((f, i) => tone(f, { t: 1.9 + i * 0.12, d: 0.35, type: 'sine', vol: 0.045 }));\n}\n\n/* ---------- jackpot y tarjetas ---------- */\n\n/** Campanitas de entrada al jackpot. */\nfunction playJackpotIntro() {\n  [1319, 1760, 2093].forEach((f, i) => tone(f, { t: i * 0.1, d: 0.5, type: 'sine', vol: 0.1 }));\n  tone(784, { d: 0.35, type: 'square', vol: 0.05 });\n}\n\n/** Giro de rodillos: /* ---------- Motor de juegos: cada juego corre en su propio marco y avisa al terminar ---------- */
let activeG=null,Q=Promise.resolve();
function playG(id){if(!(ST.games&&ST.games[id]===true)){toast('Este juego todavía no está habilitado');return}const u=me(),pr=u.prog&&u.prog[id];if(!pr)return launchG(id,null);
const m=document.createElement('div');m.className='md';m.id='rsm';
m.innerHTML=`<div class="card" role="dialog" aria-label="Partida guardada"><h3>Tenés una partida guardada</h3><p>Llegaste hasta el nivel ${pr.level+1}. ¿Querés seguir desde ahí?</p><div class="pl"><button class="btn mt" id="rs">Continuar</button><button class="btn gh" id="nw">Empezar de nuevo</button></div></div>`;
document.body.appendChild(m);$('#rs').onclick=()=>{m.remove();launchG(id,pr)};$('#nw').onclick=async()=>{m.remove();try{ME=(await api('progress/reset','POST',{game:id})).user}catch(e){toast(e.error);return}launchG(id,null)}}
function launchG(id,pr){const g=GAMES.find(x=>x.id===id);activeG=id;const v=document.createElement('div');v.className='vw gm';v.id='gm';
v.innerHTML=`<div class="gtop"><button class="btn sm gh" onclick="closeG()" aria-label="Salir del juego">✕ Salir</button><b class="dp" style="flex:1;color:#fff;font-size:1.1rem">${g.n}</b><div class="pts" id="gp">${total(me())} pts</div></div><iframe id="gf" title="${g.n}" allow="autoplay"></iframe>`;
document.body.appendChild(v);const cfg=g.battle?battleCfg():pr?{level:pr.level,score:pr.score}:null;
$('#gf').srcdoc=cfg?withCfg(GH[id],cfg):GH[id]}
function withCfg(h,cfg){const sc=`<script>window.SONORO=${JSON.stringify(cfg).replace(/</g,'\\u003c')}<\/script>`;return /<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+sc):sc+h}
function battleCfg(){const u=me(),lv=lvInfo(total(u)).lv;return{userName:u.name,charLevel:lv,state:(u.gstate&&u.gstate[activeG])||undefined,topics:Object.keys(TOP).filter(t=>ST.topics&&ST.topics[t]===true),meFig:fig(u.avatar,lv),figs:CH.map((_,i)=>fig(i,lv))}}
function closeG(){const v=$('#gm');if(v)v.remove();activeG=null;render()}
addEventListener('message',e=>{const d=e.data,f=$('#gf');if(!d||!f||e.source!==f.contentWindow||!activeG)return;if(!['level','end','battle','save'].includes(d.sonoro))return;const id=activeG;Q=Q.then(()=>handleG(id,d)).catch(()=>{})});
async function handleG(id,d){const l0=lvInfo(total(me())).lv;try{
if(d.sonoro==='level'){const p=Math.max(0,Math.round(+d.pts||0)),r=await api('progress/level','POST',{game:id,pts:p,next:d.next==null?null:d.next|0,score:Math.round(+d.score||0)});ME=r.user;toast('¡+'+p+' puntos por el nivel!')}
else if(d.sonoro==='battle'){const p=Math.max(0,Math.round(+d.pts||0));ME=(await api('progress/battle','POST',{game:id,pts:p})).user;toast('¡+'+p+' puntos por ganar la batalla!')}
else if(d.sonoro==='save'){ME=(await api('progress/save','POST',{game:id,state:String(d.state||'').slice(0,300)})).user;return}
else{ME=(await api('progress/end','POST',{game:id})).user;toast('¡+50 de bonus por terminar!')}
const gp=$('#gp');if(gp)gp.textContent=total(ME)+' pts';const l1=lvInfo(total(ME)).lv;if(l1>l0)levelUp(ME,l1)}catch(e){toast(e.error||'No se pudo guardar')}}
/* ---------- Blanqueo de contraseña (enlace del docente) ---------- */
function resetScreen(){return `<form class="card auth" onsubmit="return doReset(event)"><h1 class="dp">Nueva contraseña</h1><p>Elegí tu contraseña nueva.</p><label for="ru">Usuario</label><input id="ru" autocomplete="username" required value="${esc(RS.u)}"><label for="rc">Código de blanqueo</label><input id="rc" autocomplete="off" required value="${esc(RS.t)}"><label for="rp">Contraseña nueva</label><input id="rp" type="password" autocomplete="new-password" required><p class="err" id="er"></p><button class="btn" style="width:100%">Guardar y entrar</button><p style="text-align:center"><button type="button" class="btn sm gh" onclick="mode='login';render()">Volver</button></p></form>`}
async function doReset(ev){ev.preventDefault();const er=$('#er');if($('#rp').value.length<4){er.textContent='La contraseña necesita 4 caracteres o más.';return}
try{setSession(await api('reset','POST',{username:$('#ru').value,token:$('#rc').value,password:$('#rp').value}));try{history.replaceState(null,'',location.pathname)}catch(e){}mode='login';tab='games';render();toast('Contraseña nueva guardada')}catch(e){er.textContent=e.error}}
async function boot(){const q=new URLSearchParams(location.search);if(q.get('reset')){logoutLocal();RS={u:q.get('u')||'',t:q.get('reset')};mode='reset'}
try{ST=await api('settings')}catch(e){}
if(TOKEN&&mode!=='reset'){try{ME=(await api('me')).user}catch(e){ME=null}}
BOOT=true;render()}
boot();
